  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

318;--brand-900:#0F3D2A;--brand-700:#1A5C3A;--brand-600:#2E8B57;--brand-400:#5EC485;\n    --gold-400:#F0B429;--gold-500:#D4A017;\n    --text-primary:#111827;--text-muted:#6B7280;\n    --line:#F1F5F9;--surface:#F8FAFC;\n    --amber:#D97706;--red:#DC2626;\n    --ar:\"Noto Naskh Arabic\", serif;--sans:\"Plus Jakarta Sans\", sans-serif;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{direction:rtl;font-family:var(--sans);background:var(--surface);color:var(--text-primary);-webkit-font-smoothing:antialiased}\n  .ar{font-family:var(--ar)}\n  ::selection{background:#2E8B57;color:#fff}\n  button{font-family:inherit;cursor:pointer;border:none;background:none}\n  input,select{font-family:inherit}\n\n  .app{display:flex;min-height:100vh}\n\n  /* ===================== SIDEBAR ===================== */\n  .sidebar{width:240px;flex:0 0 240px;background:var(--brand-900);position:fixed;top:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:30}\n  .sb-logo{padding:1.5rem}\n  .brand{display:flex;align-items:center;gap:11px}\n  .hex{width:38px;height:38px;display:grid;place-items:center;position:relative;flex:0 0 auto;filter:drop-shadow(0 4px 12px rgba(240,180,41,.3))}\n  .hex svg{width:100%;height:100%}\n  .hex .meem{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ar);font-weight:700;font-size:20px;color:var(--brand-950);padding-bottom:2px}\n  .brand-txt{display:flex;flex-direction:column;line-height:1.1}\n  .brand-txt .wm{font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.02em;color:#fff}\n  .brand-txt .wm b{color:var(--gold-400)}\n  .brand-txt .sub{font-family:var(--ar);font-size:11px;color:rgba(255,255,255,.4);margin-top:3px}\n\n  .sb-nav{padding:0 .75rem;margin-top:1.5rem;display:flex;flex-direction:column;gap:4px;flex:1}\n  .nav-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:12px;font-family:var(--ar);font-size:.9rem;color:rgba(255,255,255,.6);transition:.18s;border-right:3px "bottom-tabs\">\n  <button class=\"bt active\" data-screen=\"dashboard\"><span class=\"e\">🏠<\u002Fspan>الرئيسية<\u002Fbutton>\n  <button class=\"bt\" data-screen=\"products\"><span class=\"e\">📦<\u002Fspan>المنتجات<\u002Fbutton>\n  <button class=\"bt\" data-screen=\"staff\"><span class=\"e\">👥<\u002Fspan>الموظفون<\u002Fbutton>\n  <button class=\"bt\" data-screen=\"reports\"><span class=\"e\">📊<\u002Fspan>التقارير<\u002Fbutton>\n  <button class=\"bt\" data-screen=\"settings\"><span class=\"e\">⚙️<\u002Fspan>الإعدادات<\u002Fbutton>\n<\u002Fnav>\n\n<script>\n  /* ===== nav switching ===== */\n  var titles = {dashboard:'الرئيسية',products:'المنتجات',staff:'الموظفون',reports:'التقارير',settings:'الإعدادات'};\n  function showScreen(name){\n    document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('active', s.id===name); });\n    document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.screen===name); });\n    document.querySelectorAll('.bottom-tabs .bt').forEach(function(t){ t.classList.toggle('active', t.dataset.screen===name); });\n    document.getElementById('screenTitle').textContent = titles[name] || '';\n    document.querySelector('.content').scrollTop = 0;\n  }\n  document.querySelectorAll('.nav-item, .bottom-tabs .bt').forEach(function(el){\n    el.addEventListener('click', function(){ showScreen(el.dataset.screen); });\n  });\n\n  /* ===== inline price editing ===== */\n  document.getElementById('prodBody').addEventListener('click', function(e){\n    var cell = e.target.closest('.price-cell');\n    if(!cell || cell.querySelector('input')) return;\n    var current = parseFloat(cell.dataset.price);\n    var input = document.createElement('input');\n    input.className = 'price-input';\n    input.type = 'number'; input.step = '0.01'; input.value = current.toFixed(2);\n    cell.textContent = '';\n    cell.appendChild(input);\n    input.focus(); input.select();\n    function save(){\n      var v = parseFloat(input.value);\n      if(isNaN(v) || v < 0) v = current;\n      cell.dataset.price = v.toFixed(2);\n      cell.textContent = v.toFixed(2) + ' MAD';\n      cell.classList.add('flash');\n      setTimeout(function(){ cell.classList.remove('flash'); }, 800);\n    }\n    input.addEventListener('blur', save);\n    input.addEventListener('keydown', function(ev){ if(ev.key==='Enter') input.blur(); if(ev.key==='Escape'){ cell.textContent=current.toFixed(2)+' MAD'; } });\n  });\n\n  /* ===== status toggles (products + staff) ===== */\n  document.body.addEventListener('click', function(e){\n    var pill = e.target.closest('.toggle-pill');\n    if(!pill) return;\n    var on = pill.classList.contains('on');\n    pill.classList.toggle('on', !on);\n    pill.classList.toggle('off', on);\n    /* products use نشط/متوقف ; staff use نشط/موقوف — keep whichever family it had */\n    var isStaff = pill.closest('.staff-card');\n    pill.textContent = !on ? 'نشط' : (isStaff ? 'موقوف' : 'متوقف');\n  });\n\n  /* ===== PIN change ===== */\n  document.querySelectorAll('.pin-sec').forEach(function(sec){\n    var changeBtn = sec.querySelector('.pin-change');\n    var edit = sec.querySelector('.pin-edit');\n    var input = sec.querySelector('.pin-input');\n    var saveBtn = sec.querySelector('.pin-save');\n    var cancelBtn = sec.querySelector('.pin-cancel');\n    var ok = sec.querySelector('.pin-ok');\n    var row = sec.querySelector('.pin-row');\n    changeBtn.addEventListener('click', function(){ edit.classList.add('show'); ok.classList.remove('show'); input.value=''; input.focus(); });\n    cancelBtn.addEventListener('click', function(){ edit.classList.remove('show'); });\n    saveBtn.addEventListener('click', function(){\n      var v = input.value.trim();\n      if(!/^\\d{4}$/.test(v)){ input.style.borderColor='#DC2626'; input.style.animation='shake .4s ease'; setTimeout(function(){input.style.borderColor='';input.style.animation='';},400); return; }\n      edit.classList.remove('show');\n      ok.classList.add('show');\n      setTimeout(function(){ ok.classList.remove('show'); }, 2000);\n    });\n    input.addEventListener('keydown', function(ev){ if(ev.key==='Enter') saveBtn.click(); });\n  });\n<\u002Fscript>\n<style>@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}<\u002Fstyle>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
